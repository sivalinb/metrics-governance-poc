services:
  demo:
    build: .
    depends_on:
      - collector
    restart: on-failure
  collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
